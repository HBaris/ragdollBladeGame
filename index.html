<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fc2ee">
<meta name="description" content="Menü yok: aç, koş, kes. 3D ragdoll kılıç düellosu.">
<title>Ragdoll Kılıç 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe4f2; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; left: 0; top: 0; display: block; }
  #ui { z-index: 1; }
  #hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; color: #fff; }
  #lv { position: absolute; left: calc(16px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top));
    font-size: 30px; font-weight: 800; opacity: 0.75; text-shadow: 0 1px 3px rgba(0,0,0,0.25); }
  #btns { position: absolute; right: calc(12px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top)); display: flex; gap: 10px; }
  #btns button { pointer-events: auto; width: 46px; height: 46px; padding: 6px; border: 0; background: none; color: #fff; opacity: 0.72; cursor: pointer;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }
  #banner { position: absolute; left: 0; right: 0; top: 17%; text-align: center; opacity: 0; transform: scale(0.8); transition: opacity 0.25s, transform 0.25s; }
  #banner.show { opacity: 1; transform: scale(1); }
  #b-main { font-size: clamp(40px, 11vw, 84px); font-weight: 900; letter-spacing: 1px; -webkit-text-stroke: 2px #2a0e2e; text-shadow: 0 4px 0 rgba(40,10,40,0.35); }
  #b-sub { margin-top: 6px; font-size: clamp(15px, 4vw, 22px); font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.45); }
  #banner.win #b-main { color: #ffd23f; }
  #banner.lose #b-main { color: #ff3b5c; }
  #banner.boss #b-sub { color: #d9a3ff; font-size: clamp(22px, 6vw, 34px); font-weight: 900; }
  #settings { position: absolute; right: calc(14px + env(safe-area-inset-right)); top: calc(62px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px;
    pointer-events: auto; background: rgba(20,20,40,0.55); padding: 12px; border-radius: 14px; backdrop-filter: blur(6px); }
  #settings[hidden] { display: none; }
  #settings button { font: 700 16px system-ui, sans-serif; color: #fff; background: rgba(255,255,255,0.14); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="hud"></div>
<script src="dist/game.js"></script>
</body>
</html>
